services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - $PWD/conf:/etc/caddy
      - $PWD/site/:/usr/share/caddy/
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend



  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./app.py:/app/app.py:ro
      - ./data:/app/data
    command: >
      sh -c "pip install --no-cache-dir flask &&
             python app.py"
    expose:
      - "5000"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
